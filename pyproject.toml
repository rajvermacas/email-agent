[project]
name = "info-agent"
version = "0.1.0"
description = "Multi-agent information retrieval and validation system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Info-Agent Team"}
]
keywords = ["agent", "a2a", "langgraph", "fastapi", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "httpx>=0.25.0",

    # LangGraph & Workflow
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",

    # LLM Providers
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",

    # A2A Protocol
    "a2a-sdk[http-server]>=0.2.0",

    # AG-UI Protocol
    "ag-ui-protocol>=0.1.0",

    # Data Validation & Settings
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "aiosqlite>=0.19.0",

    # Email Server
    "aiosmtpd>=1.4.4",

    # Document Processing
    "openpyxl>=3.1.2",
    "pypdf>=4.0.0",
    "pandas>=2.1.0",

    # Logging
    "structlog>=23.2.0",

    # Async Utilities
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
]

[project.scripts]
info-agent = "info_agent.main:main"
info-agent-email = "info_agent.email.server:main"
info-agent-mail-worker = "info_agent.agents.mail.server:main"
info-agent-validation-worker = "info_agent.agents.validation.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/info_agent"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["info_agent"]
